name: 'Android'
on:
  push:
    branches:
      - 'main'
    tags-ignore:
      - '**'

permissions:
  contents: read

jobs:
  build-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ['armv7', 'arm64']
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: ccache cache files
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: android-${{ runner.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
              android-${{ runner.os }}-${{ matrix.arch }}-
      - name: Build SDK [${{ matrix.arch }}]
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          LIEF_VERSION_ENV: ${{ vars.LIEF_VERSION_ENV }}
        run: |
          docker run --rm                        \
           -e CCACHE_COMPRESS=1                  \
           -e CCACHE_MAXSIZE=10.0G               \
           -e CCACHE_CPP2=1                      \
           -e CCACHE_DIR=/ccache                 \
           -e LIEF_VERSION_ENV=$LIEF_VERSION_ENV \
           -v $GITHUB_WORKSPACE:/work            \
           -v $HOME/.ccache:/ccache              \
           liefproject/android:${ARCH}           \
           bash /work/scripts/docker/android-sdk-${ARCH}
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v7
        with:
          name: android-sdk-${{ matrix.arch }}
          path: build/*.tar.gz
          retention-days: 3
  deploy:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: build-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Display artifacts
        run: ls -R
        working-directory: ${{ runner.temp }}/artifacts
      - name: Deploy
        env:
          LIEF_S3_KEY: ${{ secrets.LIEF_S3_KEY }}
          LIEF_S3_SECRET: ${{ secrets.LIEF_S3_SECRET }}
        shell: bash
        run: |
          docker run --rm                           \
            -v $GITHUB_WORKSPACE:/src               \
            -v $RUNNER_TEMP:/runner_tmp             \
            -e GITHUB_ACTIONS="true"                \
            -e GITHUB_WORKSPACE=$GITHUB_WORKSPACE   \
            -e GITHUB_REF=$GITHUB_REF               \
            -e GITHUB_REPOSITORY=$GITHUB_REPOSITORY \
            -e LIEF_S3_KEY=$LIEF_S3_KEY             \
            -e LIEF_S3_SECRET=$LIEF_S3_SECRET       \
            liefproject/deploy:github               \
            uv run python /src/.github/deploy.py /runner_tmp/artifacts
