name: LIEF Windows
on:
  push:
    branches:
      - 'foo'
    tags-ignore:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  python-test-version: '3.14'
  python-version: '3.14'
  uv-version: '0.13.5'
  CLICOLOR_FORCE: "1"
  FORCE_COLOR: "1"
  GCC_COLORS: "yes"
  COLORTERM: "truecolor"
  TERM: "screen-256color"
  CLICOLOR: "1"
  CMAKE_ARGS: "-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON"

jobs:
  build-sdk:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: ['x64', 'x86']
      fail-fast: false
    env:
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_DIR: ${{ vars.SCCACHE_DIR }}
      LIEF_VERSION_ENV: ${{ vars.LIEF_VERSION_ENV }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python-version }}
          architecture: ${{ matrix.arch }}
      - name: Install system dependencies
        run: |
          choco install sccache
      - name: Set up MSVC environment
        uses: ./.github/actions/msvc-env
        with:
          arch: ${{ matrix.arch }}
      - name: Setup sccache
        uses: actions/cache@v6
        with:
          path: ${{ vars.SCCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.arch }}-sccache-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-sccache-sdk-
      - name: Start sccache server
        run: sccache --start-server
      - name: Build SDK
        run: |
          python ./scripts/windows/package_sdk.py
      - name: 'Upload SDK artifact'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-sdk
          path: build/*.zip
          retention-days: 3
      - name: 'Upload install artifact'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-install
          path: ${{ runner.temp }}/lief-install
          retention-days: 1
      - name: sccache stats
        run: sccache --show-stats
      - name: stop sccache server
        continue-on-error: true
        run: sccache --stop-server
  tests:
    runs-on: windows-2022
    if: "!contains(github.event.head_commit.message, '[skip-test]')"
    strategy:
      matrix:
        arch: ['x64']
      fail-fast: false
    env:
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_DIR: ${{ vars.SCCACHE_DIR }}
      LIEF_VERSION_ENV: ${{ vars.LIEF_VERSION_ENV }}
      PYLIEF_CONF: ${{ github.workspace }}/scripts/windows/py-${{ matrix.arch }}-test.toml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.python-test-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python-test-version }}
          architecture: ${{ matrix.arch }}
      - name: Install system dependencies
        run: |
          choco install sccache
          python -m pip install "uv==${env:uv-version}"
      - name: Set up MSVC environment
        uses: ./.github/actions/msvc-env
        with:
          arch: ${{ matrix.arch }}
      - name: Setup sccache
        uses: actions/cache@v6
        with:
          path: ${{ vars.SCCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.arch }}-sccache-test-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-sccache-test-
      - name: Start sccache server
        run: sccache --start-server
      - name: Set env variables
        run: |
          echo ("LIEF_SAMPLES_DIR=" + $env:RUNNER_TEMP + "/samples") >> $env:GITHUB_ENV
          echo ("LIEF_BUILD_DIR=" + $env:RUNNER_TEMP + "/lief-build") >> $env:GITHUB_ENV
      - name: Build Python ${{ env.python-test-version }}
        shell: pwsh
        run: |
          uv pip install --system --verbose api/python
      - name: Download samples
        shell: pwsh
        run: |
          uv pip install --system -r tests/requirements.txt
          python tests/dl_samples.py $env:LIEF_SAMPLES_DIR
      - name: Run unittests
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE
          ctest --output-on-failure --test-dir $env:LIEF_BUILD_DIR
      - name: Run Python tests
        timeout-minutes: 20
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE
          python tests/run_pytest.py
      - name: sccache stats
        run: sccache --show-stats
      - name: stop sccache server
        continue-on-error: true
        run: sccache --stop-server
  wheels:
    runs-on: windows-2022
    needs: build-sdk
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        arch: ['x86', 'x64']
      fail-fast: false
    env:
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_DIR: ${{ vars.SCCACHE_DIR }}
      LIEF_VERSION_ENV: ${{ vars.LIEF_VERSION_ENV }}
      PYLIEF_CONF: ${{ github.workspace }}/scripts/windows/py-${{ matrix.arch }}.toml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}
      - name: Install system dependencies
        run: |
          choco install sccache
          python -m pip install "uv==${env:uv-version}"
      - name: Set up MSVC environment
        uses: ./.github/actions/msvc-env
        with:
          arch: ${{ matrix.arch }}
      - name: Save sccache
        uses: actions/cache@v6
        with:
          path: ${{ vars.SCCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.arch }}-sccache-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-sccache-${{ matrix.python-version }}-
      - name: Download LIEF install dir
        uses: actions/download-artifact@v8
        with:
          name: windows-${{ matrix.arch }}-install
          path: ~/lief-${{ matrix.arch }}-install
      - name: Start sccache server
        run: sccache --start-server
      - name: Set env variables
        run: |
          echo ("LIEF_BUILD_DIR=" + $env:RUNNER_TEMP + "/lief-build") >> $env:GITHUB_ENV
      - name: Build Python ${{ matrix.python-version }}
        shell: pwsh
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          uv build --wheel --out-dir dist/ ./api/python
      - name: 'Upload Python artifacts [${{ matrix.python-version }}]'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-wheel-${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 3
      - name: sccache stats
        run: sccache --show-stats
  deploy:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: [wheels]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts
      - name: Deploy
        env:
          LIEF_S3_KEY: ${{ secrets.LIEF_S3_KEY }}
          LIEF_S3_SECRET: ${{ secrets.LIEF_S3_SECRET }}
        shell: bash
        run: |
          docker run --rm                                     \
            -v $GITHUB_WORKSPACE:/src                         \
            -v $RUNNER_TEMP:/runner_tmp                       \
            -e GITHUB_ACTIONS="true"                          \
            -e GITHUB_WORKSPACE=$GITHUB_WORKSPACE             \
            -e GITHUB_REF=$GITHUB_REF                         \
            -e GITHUB_REPOSITORY=$GITHUB_REPOSITORY           \
            -e LIEF_S3_KEY=$LIEF_S3_KEY                       \
            -e LIEF_S3_SECRET=$LIEF_S3_SECRET                 \
            liefproject/deploy:github                         \
            uv run python /src/.github/deploy.py --skip-sdk /runner_tmp/artifacts
