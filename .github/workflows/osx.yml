name: 'macOS'
on:
  push:
    branches:
      - 'main'
    tags-ignore:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

defaults:
  run:
    shell: bash

env:
  python-test-version: '3.14'
  uv-version: '0.13.5'
  CLICOLOR_FORCE: "1"
  FORCE_COLOR: "1"

jobs:
  osx-sdk:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CCACHE_MAXSIZE: 10.0G
      CCACHE_CPP2: 1
      CCACHE_COMPRESS: 1
      LIEF_VERSION_ENV: ${{ vars.LIEF_VERSION_ENV }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          brew install cmake ninja ccache
      - name: Setup cache dir
        run: |
          mkdir -p "${RUNNER_TEMP}/.ccache"
          echo "CCACHE_DIR=${RUNNER_TEMP}/.ccache" >> "${GITHUB_ENV}"
      - name: ccache cache files
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.ccache
          key: osx-${{ runner.os }}-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
              osx-${{ runner.os }}-sdk-
      - name: Build SDK
        run: |
          bash scripts/osx/package_sdk.sh
      - name: 'Upload SDK Artifact'
        uses: actions/upload-artifact@v7
        with:
          name: osx-sdk
          path: build/*.tar.gz
          retention-days: 3
      - name: 'Upload install artifact [arm64]'
        uses: actions/upload-artifact@v7
        with:
          name: osx-arm64-install
          path: install/arm64
          retention-days: 1
      - name: 'Upload install artifact [x64]'
        uses: actions/upload-artifact@v7
        with:
          name: osx-x64-install
          path: install/x64
          retention-days: 1
      - name: ccache stats
        run: ccache --show-stats
  osx-testing:
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, '[skip-test]')"
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CCACHE_MAXSIZE: 10.0G
      CCACHE_CPP2: 1
      CCACHE_COMPRESS: 1
      LIEF_VERSION_ENV: ${{ vars.LIEF_VERSION_ENV }}
      LIEF_SAMPLES_DIR: "/tmp/samples"
      LIEF_BUILD_DIR: "/tmp/lief-build"
      PYLIEF_CONF: ${{ github.workspace }}/scripts/osx/osx-testing-x64.toml
      PYTEST_ADDOPTS: "--color=yes"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.python-test-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python-test-version }}
      - name: Install system dependencies
        run: |
          brew install cmake ninja ccache
          python -m pip install "uv==${{ env.uv-version }}"
      - name: Setup cache dir
        run: |
          mkdir -p "${RUNNER_TEMP}/.ccache"
          echo "CCACHE_DIR=${RUNNER_TEMP}/.ccache" >> "${GITHUB_ENV}"
      - name: ccache cache files
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.ccache
          key: osx-${{ runner.os }}-test-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
              osx-${{ runner.os }}-test-
      - name: Build Python ${{ env.python-test-version }}
        run: |
          uv pip install --system --verbose api/python
      - name: Download samples
        run: |
          uv pip install --system -r tests/requirements.txt
          python tests/dl_samples.py "${LIEF_SAMPLES_DIR}"
      - name: Run unittests
        run: |
          ctest --output-on-failure --test-dir "${LIEF_BUILD_DIR}/"
      - name: Run tools check
        run: |
          python tests/run_tools_check.py "${LIEF_BUILD_DIR}/"
      - name: Run Python tests
        timeout-minutes: 20
        run: |
          python tests/run_pytest.py
      - name: ccache stats
        run: ccache --show-stats
  wheels:
    runs-on: macos-latest
    needs: osx-sdk
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        arch: ['x64', 'arm64']
      fail-fast: false
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CCACHE_MAXSIZE: 10.0G
      CCACHE_CPP2: 1
      CCACHE_COMPRESS: 1
      LIEF_VERSION_ENV: ${{ vars.LIEF_VERSION_ENV }}
      PYLIEF_CONF: ${{ github.workspace }}/scripts/osx/py-${{ matrix.arch }}.toml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          brew install cmake ninja ccache
          python -m pip install "uv==${{ env.uv-version }}"
      - name: Setup cache dir
        run: |
          mkdir -p "${RUNNER_TEMP}/.ccache"
          echo "CCACHE_DIR=${RUNNER_TEMP}/.ccache" >> "${GITHUB_ENV}"
      - name: ccache cache files
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.ccache
          key: osx-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
              osx-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.python-version }}-
      - name: Download LIEF install dir
        uses: actions/download-artifact@v8
        with:
          name: osx-${{ matrix.arch }}-install
          path: ~/lief-${{ matrix.arch }}-install
      - name: Build Python ${{ matrix.python-version }} [${{ matrix.arch }}]
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          uv build --wheel --out-dir dist/ ./api/python
      - name: 'Upload Python wheel artifact - ${{ matrix.python-version }}'
        uses: actions/upload-artifact@v7
        with:
          name: osx-wheel-${{ matrix.arch }}-${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 3
      - name: ccache stats
        run: ccache --show-stats
  deploy:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [wheels]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: osx-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts
      - name: Display artifacts
        run: ls -R
        working-directory: ${{ runner.temp }}/artifacts
      - name: Deploy
        env:
          LIEF_S3_KEY: ${{ secrets.LIEF_S3_KEY }}
          LIEF_S3_SECRET: ${{ secrets.LIEF_S3_SECRET }}
        run: |
          docker run --rm                                     \
            -v $GITHUB_WORKSPACE:/src                         \
            -v $RUNNER_TEMP:/runner_tmp                       \
            -e GITHUB_ACTIONS="true"                          \
            -e GITHUB_WORKSPACE=$GITHUB_WORKSPACE             \
            -e GITHUB_REF=$GITHUB_REF                         \
            -e GITHUB_REPOSITORY=$GITHUB_REPOSITORY           \
            -e LIEF_S3_KEY=$LIEF_S3_KEY                       \
            -e LIEF_S3_SECRET=$LIEF_S3_SECRET                 \
            liefproject/deploy:github                         \
            uv run python /src/.github/deploy.py --skip-sdk /runner_tmp/artifacts
